# Nginx reverse proxy config for Keycloak
# Place in /etc/nginx/sites-available/keycloak.conf on the VPS,
# then symlink into sites-enabled and run certbot for TLS.

server {
    listen 80;
    server_name sso.asianland.ph;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After running: sudo certbot --nginx -d sso.asianland.ph
# Certbot will auto-add the HTTPS server block and redirect HTTP -> HTTPS.
